name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Builds the double-click app for the three desktop platforms.
#
# These binaries are NOT code-signed. Windows SmartScreen will warn, and macOS
# Gatekeeper will refuse to open it until the user right-clicks and chooses
# Open. Signing needs a paid certificate per platform and an identity to sign
# under, which is a decision for the owner rather than something to fake.
# The README says this plainly rather than letting someone hit it cold.

jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: proofmark-windows
            binary: proofmark.exe
          - os: macos-latest
            artifact: proofmark-macos
            binary: proofmark
          - os: ubuntu-latest
            artifact: proofmark-linux
            binary: proofmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # crypto goes in too. Without ccxt bundled, the Start button in the
      # packaged app fails on a missing import, and the packaged app is the
      # only route a Windows user has: it is windowed, so there is no console
      # to pip install into.
      - run: pip install -e ".[desktop,crypto]" pyinstaller

      - name: build
        run: >
          pyinstaller packaging/desktop.py
          --name proofmark
          --onefile
          --windowed
          --clean
          --noconfirm
          --collect-all webview
          --collect-all ccxt

      # A binary that does not start is worse than no binary, and the failure
      # mode is silent for someone who double-clicks it. Prove it runs.
      - name: the binary actually starts and serves
        shell: bash
        env:
          # No display on a build runner, so serve without drawing a window.
          PROOFMARK_NO_WINDOW: "1"
        run: |
          ./dist/${{ matrix.binary }} &
          pid=$!
          sleep 6
          for port in 8765 8766 8767 8768; do
            if curl -fsS "http://127.0.0.1:$port/" -o /dev/null 2>/dev/null; then
              echo "served on $port"
              kill $pid 2>/dev/null || true
              exit 0
            fi
          done
          echo "binary started but never served a page"
          kill $pid 2>/dev/null || true
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  publish:
    # The build matrix produced three binaries and left them as artifacts, which
    # is where they stayed. Nothing attached them to a release, so cutting a tag
    # made three files that only someone browsing the Actions tab could find.
    needs: desktop
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Named per platform, because three files called "proofmark" in one
      # downloads folder is a puzzle rather than a release.
      - name: name the binaries after their platform
        run: |
          mkdir -p release
          cp artifacts/proofmark-windows/proofmark.exe release/proofmark-windows.exe
          cp artifacts/proofmark-macos/proofmark      release/proofmark-macos
          cp artifacts/proofmark-linux/proofmark      release/proofmark-linux
          chmod +x release/proofmark-macos release/proofmark-linux
          ls -lh release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            **Windows: download `proofmark-windows.exe` and double-click it.**

            These binaries are not code-signed. Windows SmartScreen will warn,
            and macOS will refuse to open the file until you right-click and
            choose Open. Signing costs money per platform per year, and saying
            so is better than a warning nobody warned you about.

            Paper trading only. No key that can place an order is used anywhere
            in this program, and there is no setting that changes that.
