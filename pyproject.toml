[project]
name = "proofmark"
version = "0.3.0"
description = "A backtest engine whose defaults make self-deception expensive."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Corey Higgins" }]
keywords = ["backtesting", "trading", "quant", "overfitting", "lookahead-bias"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]

# The core has no dependencies at all, on purpose. Guards, metrics and the
# lookahead detector run on plain sequences of mappings, so a project can
# import them next to whatever engine it already uses without inheriting a
# dependency tree. Exchange and data adapters live behind extras.
dependencies = []

# Without this, `pip install proofmark` succeeds and then `proofmark gui` does
# not exist, which is every install instruction in the README failing at the
# first step. It went missing once during an unrelated edit and was caught by
# installing the built wheel into a clean environment. CI now does that on
# every push.
[project.scripts]
proofmark = "proofmark.cli:main"

[project.optional-dependencies]
# A real window instead of a browser tab. Uses the platform webview, which on
# Windows is the Edge WebView2 runtime that ships with the OS, so this adds a
# thin binding rather than a browser engine. Optional on purpose: the library
# and the CLI stay dependency-free.
desktop = ["pywebview>=5.0"]
crypto = ["ccxt>=4.4"]
equities = ["alpaca-py>=0.30"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/coreyhiggins/proofmark"
Issues = "https://github.com/coreyhiggins/proofmark/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proofmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
